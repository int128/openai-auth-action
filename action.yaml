name: openai-auth-action
description: Acquire a short-live token with OpenAI workload identity federation.
inputs:
  audience:
    description: Audience
    required: true
  identity-provider-id:
    description: Workload identity provider ID
    required: true
  service-account-id:
    description: Service account ID
    required: true
outputs:
  token:
    description: A short-lived token for OpenAI
runs:
  using: 'node24'
  main: 'dist/index.js'
